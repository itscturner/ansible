---
# tasks file for docker - Setup RedHat

- name: setup-RedHat | Ensure old Docker versions are removed
  ansible.builtin.dnf:
    name: [docker, docker-client, docker-client-latest, docker-common, docker-latest, docker-latest-logrotate, docker-logrotate, docker-engine]
    state: absent
  become: true

- name: setup-RedHat | Install dnf-plugins-core
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present
  become: true

- name: setup-RedHat | Add Docker official repository
  ansible.builtin.dnf_config_manager:
    add_repo: https://docker.com
  become: true

- name: setup-RedHat | Install Docker and Docker Compose
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true
  become: true
