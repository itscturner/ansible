---
# tasks file for bitwarden

- name: Import assert.yml
  ansible.builtin.import_tasks:
    file: assert.yml
  run_once: true
  delegate_to: localhost

- name: Load OS-family variables
  include_vars:
    file: "vars/{{ ansible_os_family }}.yml"

- name: Include configure.yml
  ansible.builtin.include_tasks:
    file: configure.yml
