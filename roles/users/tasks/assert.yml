---
# tasks file for users - assert

- name: assert | Verify Users Create Home variable
  ansible.builtin.assert:
    that:
      - users_create_home is defined
      - users_create_home is string
      - users_create_home is not none
    faul_msg: "Users Create Home variable (users_create_home) is not valid."
    quiet: true

- name: assert | Verify Users Default Shell variable
  ansible.builtin.assert:
    that:
      - users_default_shell is defined
      - users_default_shell is string
      - users_default_shell is not none
    faul_msg: "Users Default Shell variable (users_default_shell) is not valid."
    quiet: true
